<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Game</title>
    <link rel="stylesheet" href="rock.css">
</head>
<body>
    <div class="mainbar">
        <h1 class="h1">Rock Paper Scssors</h1>
        <div class="choose">
            <div class="ol" id="rocky"><img src="rock.png" alt="stone" id="rock"><h2 class="rps">Rock</h2></div>
            <div class="ol" id="paper"><img src="hand.png" alt="Paper"><h2 class="rps">Paper</h2></div>
            <div class="ol" id="ses"><img src="ChatGPT Image Aug 25, 2026, 06_07_02 PM.png" alt="sessior"><h2 class="rps">Scissors</h2></div>
        </div>
        <p>Choose your move</p>
        <div class="count">
            <div class="self " class="all">
                <h1 id="me" class="name">You</h1>
                <h1 id="counting">0</h1>
            </div>
            <div class="win" class="all">
                <p class="res">Result</p>
                <h1 id="wins">Make your Move</h1>
            </div>
            <div class="comp" class="comp">
                <h1 id="ai" class="name">Ai</h1>
                <h1 id="score">0</h1>
            </div>
        </div>
        <button class="rep">Reset</button>

    </div>
    <script src="rock.js"></script>
</body>
</html>
